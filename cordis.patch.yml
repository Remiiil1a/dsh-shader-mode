# `dsh-shader-mode` composition.
#
# Three rows:
#
#   1. `shader-mode`           a Host row. It is GLOBAL — mounted once for the
#                              whole profile, outside any preset — so it
#                              registers nothing. It validates the config and
#                              logs one line. Anything registered here would
#                              reach every session in every mode.
#   2. `preset-shader-lead`    the preset the user selects for a shader session.
#                              It mounts `dsh-shader-mode/lead`: the dispatch
#                              tools, the lead's standing instructions, and the
#                              guard.
#   3. `preset-shader-worker`  the preset every dispatched worker runs on. It
#                              mounts `dsh-shader-mode/worker` (standing worker
#                              instructions) and `dsh-shader-mode/skills` (the
#                              shader-mode skills shipped in this package).
#
# The split is the point: a preset-scoped row is mounted once per preset
# revision and shared by every agent that selects it, so a worker never sees
# the lead's tools and a lead never sees the worker's instructions.
#
# ⚠️ The Host row must stay empty. An earlier version mounted the lead's tools
# on it, and a standard-mode session then had `shader_dispatch` in its tool list
# and "you are the lead of a shader-mode session" in its system prompt. A global
# row reaches every session; a preset row reaches only the sessions that chose
# it.

- insert:
    - id: shader-mode
      name: dsh-shader-mode
      config:
        # Preset id the lead's `shader_dispatch` starts every worker with.
        # Change this only together with the `preset-shader-worker` row below.
        workerPreset: shader-worker
        # Delegation depth handed to each worker. 1 lets the lead start direct
        # children, which is what a dispatch is. 0 does NOT mean "leaf": the
        # child depth is parentDepth + 1, so 0 rejects every dispatch with
        # SubagentDepthError. Raise it only when a worker must fan out itself.
        maxDepth: 1

    - id: preset-shader-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: shader-lead
        # A custom preset's `name` and `description` are rendered verbatim: the
        # Web UI only localizes the four shipped presets, by id, from its own
        # dictionaries. So the Chinese copy lives here rather than in locale/.
        name: 着色器模式（主）
        description: 与你交流、规划工作，并把每个任务连同明确的技能指派交给子智能体。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是着色器模式会话的主智能体，由 {{model}} 模型驱动。
          - id: shader-mode-lead
            name: dsh-shader-mode/lead
            config:
              workerPreset: shader-worker
              maxDepth: 1
              # Skills that must not be assigned to a worker, because they are
              # written for a different role: a whole-project flow that starts
              # by freezing requirements with a user, or an orchestrator that
              # creates its own team. Omit this key to keep the built-in list
              # (shader-single, shader-single-strict, shader-team-lead); supply
              # an array to replace it, e.g. to add a skill this package has
              # not heard of.
              # leadOnlySkills: []
              # Attach a corrective note when the lead edits a file or runs a
              # command itself. On by default: the first real session showed a
              # rule in a prompt loses to momentum, so the reminder is a
              # mechanism rather than advice. Set false to silence it.
              remindOnDirectEdit: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              # `tool-workflow` injects `workflowEngine`, which only
              # `workflow-ptc` provides. Mounting the tool without its provider
              # leaves the row waiting forever, so the preset reports
              # "waiting for workflowEngine" and never activates.
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

    - id: preset-shader-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: shader-worker
        name: 着色器模式（子）
        description: 执行一个派发来的任务，加载主智能体指派的技能，并向主智能体回报而不是向用户。
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是着色器模式会话的子智能体，由 {{model}} 模型驱动。
          - id: shader-mode-worker
            name: dsh-shader-mode/worker
            config:
              leadName: 主智能体
          - id: shader-mode-skills
            name: dsh-shader-mode/skills
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

