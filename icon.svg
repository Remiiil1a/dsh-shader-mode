  <circle cx="44" cy="18" r="4" fill="none" stroke="url(#sm-beam)" stroke-width="2.2"/>
  <circle cx="44" cy="32" r="4" fill="none" stroke="url(#sm-beam)" stroke-width="2.2"/>
  <circle cx="44" cy="46" r="4" fill="none" stroke="url(#sm-beam)" stroke-width="2.2"/>
</svg>
