<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Shader mode">
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="sm-beam" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="0.55" stop-color="#7c9cff"/>
